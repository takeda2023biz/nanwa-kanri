<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アカウント情報照会 | ナンワ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
--primary: #1a3a5c;
--accent: #2e7d9e;
--bg: #f4f6f9;
--card: #ffffff;
--text: #1a1a2e;
--muted: #6b7a8d;
--border: #dde3ea;
--success: #2d7a4f;
--error: #c0392b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: 'Noto Sans JP', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
flex-direction: column;
}

header {
background: var(--primary);
color: white;
padding: 16px 24px;
display: flex;
align-items: center;
gap: 12px;
box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

header .logo {
width: 36px; height: 36px;
background: rgba(255,255,255,0.15);
border-radius: 8px;
display: flex; align-items: center; justify-content: center;
font-size: 18px;
}

header h1 { font-size: 16px; font-weight: 500; letter-spacing: 0.05em; }
header p { font-size: 11px; opacity: 0.65; margin-top: 2px; }

main {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
padding: 40px 20px;
}

.card {
background: var(--card);
border-radius: 16px;
box-shadow: 0 4px 24px rgba(0,0,0,0.08);
padding: 40px;
width: 100%;
max-width: 440px;
}

.card-wide {
max-width: 620px;
}

.card-title {
font-size: 20px;
font-weight: 700;
color: var(--primary);
margin-bottom: 6px;
}

.card-sub {
font-size: 13px;
color: var(--muted);
margin-bottom: 28px;
line-height: 1.6;
}

label {
display: block;
font-size: 12px;
font-weight: 500;
color: var(--muted);
margin-bottom: 6px;
letter-spacing: 0.05em;
}

input[type="email"],
input[type="text"],
input[type="password"] {
width: 100%;
padding: 12px 16px;
border: 1.5px solid var(--border);
border-radius: 8px;
font-size: 15px;
font-family: inherit;
color: var(--text);
background: #fafbfc;
transition: border-color 0.2s;
outline: none;
}

input:focus { border-color: var(--accent); background: white; }

.btn {
width: 100%;
padding: 13px;
border: none;
border-radius: 8px;
font-size: 15px;
font-family: inherit;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
margin-top: 16px;
}

.btn-primary {
background: var(--primary);
color: white;
}
.btn-primary:hover { background: var(--accent); }
.btn-primary:disabled { background: #b0bec5; cursor: not-allowed; }

.btn-admin {
background: #5c3a1a;
color: white;
margin-top: 10px;
font-size: 13px;
padding: 10px;
}
.btn-admin:hover { background: #7d5a2e; }

.msg {
margin-top: 14px;
padding: 12px 16px;
border-radius: 8px;
font-size: 13px;
line-height: 1.5;
display: none;
}
.msg.show { display: block; }
.msg.success { background: #e8f5ee; color: var(--success); border: 1px solid #b2dfce; }
.msg.error { background: #fdecea; color: var(--error); border: 1px solid #f5c6c2; }
.msg.info { background: #e3f0f7; color: var(--accent); border: 1px solid #b3d4e8; }

.step { display: none; }
.step.active { display: block; }

.pin-hint {
font-size: 12px;
color: var(--muted);
margin-top: 8px;
text-align: center;
}

#result-section { display: none; }

.result-header {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 20px;
padding-bottom: 16px;
border-bottom: 1px solid var(--border);
}

.result-header .avatar {
width: 44px; height: 44px;
background: var(--primary);
border-radius: 50%;
color: white;
display: flex; align-items: center; justify-content: center;
font-size: 18px; font-weight: 700;
}

.result-header .name { font-size: 16px; font-weight: 700; }
.result-header .dept { font-size: 12px; color: var(--muted); margin-top: 2px; }

.admin-badge {
display: inline-block;
background: #5c3a1a;
color: white;
font-size: 10px;
padding: 2px 8px;
border-radius: 10px;
margin-left: 8px;
vertical-align: middle;
}

.service-card {
border: 1px solid var(--border);
border-radius: 10px;
padding: 16px 18px;
margin-bottom: 12px;
background: #fafbfc;
}

.service-name {
font-size: 13px;
font-weight: 700;
color: var(--primary);
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 6px;
}

.service-name::before {
content: '';
width: 6px; height: 6px;
background: var(--accent);
border-radius: 50%;
display: inline-block;
}

.info-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 6px 0;
border-bottom: 1px solid #eef0f3;
font-size: 13px;
}
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--muted); font-size: 12px; }
.info-value {
font-weight: 500;
display: flex;
align-items: center;
gap: 8px;
}

.copy-btn {
background: none;
border: 1px solid var(--border);
border-radius: 4px;
padding: 2px 8px;
font-size: 11px;
cursor: pointer;
color: var(--muted);
transition: all 0.15s;
}
.copy-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

.pw-mask { font-family: monospace; letter-spacing: 2px; }

.toggle-pw {
background: none; border: none; cursor: pointer;
color: var(--muted); font-size: 12px; padding: 0;
}

.logout-btn {
margin-top: 20px;
width: 100%;
padding: 10px;
background: none;
border: 1.5px solid var(--border);
border-radius: 8px;
font-size: 13px;
font-family: inherit;
color: var(--muted);
cursor: pointer;
transition: all 0.2s;
}
.logout-btn:hover { border-color: var(--error); color: var(--error); }

.loading { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }

/* 管理者：社員検索 */
#admin-section { display: none; }

.search-bar {
display: flex;
gap: 8px;
margin-bottom: 16px;
}

.search-bar input {
flex: 1;
padding: 10px 14px;
border: 1.5px solid var(--border);
border-radius: 8px;
font-size: 14px;
font-family: inherit;
outline: none;
}
.search-bar input:focus { border-color: var(--accent); }

.search-bar button {
padding: 10px 18px;
background: var(--primary);
color: white;
border: none;
border-radius: 8px;
font-size: 14px;
font-family: inherit;
cursor: pointer;
}
.search-bar button:hover { background: var(--accent); }

.emp-list { margin-bottom: 16px; }

.emp-item {
display: flex;
align-items: center;
justify-content: space-between;
padding: 10px 14px;
border: 1px solid var(--border);
border-radius: 8px;
margin-bottom: 6px;
cursor: pointer;
transition: all 0.15s;
background: #fafbfc;
}
.emp-item:hover { border-color: var(--accent); background: #e3f0f7; }

.emp-item .emp-name { font-size: 14px; font-weight: 600; }
.emp-item .emp-dept { font-size: 12px; color: var(--muted); margin-top: 2px; }
.emp-item .emp-arrow { color: var(--muted); font-size: 16px; }

footer {
text-align: center;
padding: 16px;
font-size: 11px;
color: var(--muted);
}

.divider {
display: flex;
align-items: center;
gap: 10px;
margin: 16px 0 0;
color: var(--muted);
font-size: 12px;
}
.divider::before, .divider::after {
content: '';
flex: 1;
height: 1px;
background: var(--border);
}
</style>
</head>
<body>

<header>
<div class="logo">🔐</div>
<div>
<h1>アカウント情報照会</h1>
<p>ナンワ 管理本部</p>
</div>
</header>

<main>
<!-- ログイン前フォーム -->
<div class="card" id="login-card">

<!-- Step 1: メールアドレス入力 -->
<div class="step active" id="step1">
<div class="card-title">本人確認</div>
<div class="card-sub">自分のメールアドレスを入力してください。<br>ワンタイムPIN（6桁）をお送りします。</div>

<label>メールアドレス</label>
<div style="display:flex;align-items:center;gap:8px;">
<input type="text" id="email-input" placeholder="例：takeda" style="flex:1;" />
<span style="font-size:14px;color:var(--muted);white-space:nowrap;">@k-nanwa.co.jp</span>
</div>

<button class="btn btn-primary" id="send-pin-btn" onclick="sendPin()">PINを送信する</button>
<div class="msg" id="msg1"></div>

<div class="divider">管理者の方はこちら</div>
<button class="btn btn-admin" onclick="showAdminLogin()">🔑 管理者ログイン</button>
</div>

<!-- Step 2: PIN入力 -->
<div class="step" id="step2">
<div class="card-title">PIN入力</div>
<div class="card-sub" id="pin-desc">メールに送信された6桁のPINを入力してください。</div>

<label>ワンタイムPIN（6桁）</label>
<input type="text" id="pin-input" placeholder="000000" maxlength="6" inputmode="numeric" />
<div class="pin-hint">有効期限：10分間</div>

<button class="btn btn-primary" onclick="verifyPin()">確認する</button>
<div class="msg" id="msg2"></div>

<button style="margin-top:12px;width:100%;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;" onclick="backToStep1()">← メールアドレスを変更する</button>
</div>

<!-- Step 3: 管理者パスワード入力 -->
<div class="step" id="step-admin">
<div class="card-title">管理者ログイン</div>
<div class="card-sub">管理システム（index.html）と同じアカウントでログインしてください。<br>権限が「full」の方のみ利用できます。</div>

<label>メールアドレス</label>
<input type="email" id="admin-email-input" placeholder="例：takeda@k-nanwa.co.jp" autocomplete="username" />
<label style="margin-top:12px;">パスワード</label>
<input type="password" id="admin-pw-input" placeholder="パスワードを入力" autocomplete="current-password" onkeydown="if(event.key==='Enter')verifyAdminPw()" />

<button class="btn btn-admin" style="margin-top:16px;" onclick="verifyAdminPw()">ログイン</button>
<div class="msg" id="msg-admin"></div>

<button style="margin-top:12px;width:100%;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;" onclick="backToStep1()">← 戻る</button>
</div>

</div>

<!-- 一般ユーザー結果表示 -->
<div class="card" id="result-section">
<div class="result-header">
<div class="avatar" id="result-avatar">T</div>
<div>
<div class="name" id="result-name"></div>
<div class="dept" id="result-dept"></div>
</div>
</div>

<div id="accounts-list">
<div class="loading">読み込み中...</div>
</div>

<button class="logout-btn" onclick="logout()">ログアウト</button>
</div>

<!-- 管理者：社員検索・閲覧 -->
<div class="card card-wide" id="admin-section">
<div class="result-header">
<div class="avatar" style="background:#5c3a1a;">👑</div>
<div>
<div class="name">管理者モード <span class="admin-badge">ADMIN</span></div>
<div class="dept">社員のアカウント情報を検索・閲覧できます</div>
</div>
</div>

<div class="search-bar">
<input type="text" id="admin-search-input" placeholder="氏名または読み仮名で検索" onkeydown="if(event.key==='Enter')searchEmployee()" />
<button onclick="searchEmployee()">検索</button>
</div>

<div id="admin-emp-list" class="emp-list"></div>
<div id="admin-account-view"></div>

<button class="logout-btn" onclick="logout()">ログアウト</button>
</div>
</main>

<footer>© ナンワ 管理本部</footer>

<script>
const SUPABASE_URL = 'https://cicxvcjnvkynhukbnrns.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpY3h2Y2pudmt5bmh1a2Jucm5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNjI4ODYsImV4cCI6MjA5MTYzODg4Nn0.MQs-YYzLJ-gEgvgY7vyw2NGwzqc76TLWIq08GDK8sMQ';
// 管理者モードのログイン状態は index.html と共有しない（別キーで保持）
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: 'nanwa-myaccount-admin', persistSession: false }
});
const OTP_FN_URL = SUPABASE_URL + '/functions/v1/myaccount-otp';

let currentUsername = '';
let isAdmin = false;

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg show ${type}`;
}

function hideMsg(id) {
  document.getElementById(id).className = 'msg';
}

async function callOtp(payload) {
  try {
    const res = await fetch(OTP_FN_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify(payload)
    });
    const body = await res.json().catch(() => ({}));
    return { status: res.status, ...body };
  } catch (e) {
    return { ok: false, error: 'network' };
  }
}

function showAdminLogin() {
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step-admin').classList.add('active');
}

async function verifyAdminPw() {
  const email = document.getElementById('admin-email-input').value.trim();
  const pw = document.getElementById('admin-pw-input').value;
  if (!email || !pw) { showMsg('msg-admin', 'メールアドレスとパスワードを入力してください', 'error'); return; }
  hideMsg('msg-admin');

  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { showMsg('msg-admin', 'ログインに失敗しました', 'error'); return; }

  const { data: role } = await sb.rpc('my_system_role');
  if (role !== 'full') {
    await sb.auth.signOut();
    showMsg('msg-admin', '管理者権限がありません', 'error');
    return;
  }
  isAdmin = true;
  document.getElementById('admin-pw-input').value = '';
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('admin-section').style.display = 'block';
}

async function searchEmployee() {
  if (!isAdmin) return;
  const q = document.getElementById('admin-search-input').value.trim().replace(/[%,()*]/g, '');
  if (!q) return;

  const { data, error } = await sb
    .from('employees')
    .select('id, name, yomi, honbu, dept, email')
    .or(`name.ilike.%${q}%,yomi.ilike.%${q}%`)
    .order('yomi');

  const listEl = document.getElementById('admin-emp-list');
  document.getElementById('admin-account-view').innerHTML = '';

  if (error || !data || data.length === 0) {
    listEl.innerHTML = '<div class="loading">該当する社員が見つかりません</div>';
    return;
  }

  listEl.innerHTML = data.map((emp, i) => `
<div class="emp-item" data-idx="${i}">
<div>
<div class="emp-name">${esc(emp.name)}</div>
<div class="emp-dept">${esc(emp.honbu)}${emp.dept ? ' / ' + esc(emp.dept) : ''}</div>
</div>
<div class="emp-arrow">›</div>
</div>
`).join('');
  listEl.querySelectorAll('.emp-item').forEach(el => {
    el.addEventListener('click', () => showAdminAccount(data[Number(el.dataset.idx)]));
  });
}

async function showAdminAccount(emp) {
  document.getElementById('admin-emp-list').innerHTML = '';
  const viewEl = document.getElementById('admin-account-view');
  viewEl.innerHTML = '<div class="loading">読み込み中...</div>';

  const { data: accounts, error } = await sb
    .from('accounts')
    .select('id, service_name, login_id, password, note')
    .eq('employee_id', emp.id)
    .order('service_name');

  viewEl.innerHTML = `
<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);">
<button id="admin-back-btn" style="background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--muted);">← 戻る</button>
<div>
<div style="font-size:15px;font-weight:700;">${esc(emp.name)}</div>
<div style="font-size:12px;color:var(--muted);">${esc(emp.honbu)}${emp.dept ? ' / ' + esc(emp.dept) : ''}</div>
</div>
</div>
<div id="admin-acc-list"></div>
`;
  document.getElementById('admin-back-btn').addEventListener('click', () => {
    document.getElementById('admin-emp-list').innerHTML = '';
    document.getElementById('admin-account-view').innerHTML = '';
    document.getElementById('admin-search-input').value = '';
  });
  renderAccounts(document.getElementById('admin-acc-list'), error ? [] : accounts);
}

// アカウント一覧の描画（値はすべてエスケープし、パスワードはHTML属性に埋め込まない）
function renderAccounts(container, accounts) {
  if (!accounts || accounts.length === 0) {
    container.innerHTML = '<div class="loading">登録されているアカウント情報がありません</div>';
    return;
  }
  container.innerHTML = accounts.map((acc, i) => `
<div class="service-card">
<div class="service-name">${esc(acc.service_name)}</div>
${acc.login_id ? `
<div class="info-row">
<span class="info-label">ログインID</span>
<span class="info-value">
${esc(acc.login_id)}
<button class="copy-btn" data-copy="id" data-idx="${i}">コピー</button>
</span>
</div>` : ''}
${acc.password ? `
<div class="info-row">
<span class="info-label">パスワード</span>
<span class="info-value">
<span class="pw-mask" data-pw="${i}">••••••••</span>
<button class="toggle-pw" data-idx="${i}">表示</button>
<button class="copy-btn" data-copy="pw" data-idx="${i}">コピー</button>
</span>
</div>` : ''}
${acc.note ? `
<div class="info-row">
<span class="info-label">備考</span>
<span class="info-value">${esc(acc.note)}</span>
</div>` : ''}
</div>
`).join('');

  container.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const acc = accounts[Number(btn.dataset.idx)];
      copyText(btn.dataset.copy === 'pw' ? acc.password : acc.login_id, btn);
    });
  });
  container.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.idx);
      const el = container.querySelector(`[data-pw="${i}"]`);
      if (el.textContent === '••••••••') {
        el.textContent = accounts[i].password;
        btn.textContent = '隠す';
      } else {
        el.textContent = '••••••••';
        btn.textContent = '表示';
      }
    });
  });
}

async function sendPin() {
  const username = document.getElementById('email-input').value.trim();
  if (!username) { showMsg('msg1', 'ユーザー名を入力してください', 'error'); return; }

  const btn = document.getElementById('send-pin-btn');
  btn.disabled = true;
  btn.textContent = '送信中...';
  hideMsg('msg1');

  const r = await callOtp({ action: 'request', username });
  btn.disabled = false;
  btn.textContent = 'PINを送信する';

  if (!r.ok) {
    const msg = {
      not_found: '登録されていないメールアドレスです',
      invalid_user: 'ユーザー名の形式が正しくありません',
      too_soon: '1分ほど待ってから再度お試しください',
      too_many: 'PINの送信回数が上限に達しました。しばらくしてからお試しください'
    }[r.error] || 'メール送信に失敗しました。再度お試しください';
    showMsg('msg1', msg, 'error');
    return;
  }

  currentUsername = username;
  const email = username.includes('@') ? username : username + '@k-nanwa.co.jp';
  document.getElementById('pin-desc').textContent = `${email} に6桁のPINを送信しました。`;
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  showMsg('msg2', 'PINを送信しました。メールをご確認ください。', 'success');
}

async function verifyPin() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!/^\d{6}$/.test(pin)) { showMsg('msg2', '6桁のPINを入力してください', 'error'); return; }
  hideMsg('msg2');

  const r = await callOtp({ action: 'verify', username: currentUsername, pin });
  if (!r.ok) {
    const msg = {
      wrong_pin: `PINが正しくありません（残り${r.remaining ?? 0}回）`,
      locked: '入力回数の上限に達しました。PINを再送信してください',
      expired: 'PINの有効期限が切れています。再送信してください'
    }[r.error] || 'PINが正しくないか、有効期限が切れています';
    showMsg('msg2', msg, 'error');
    return;
  }
  document.getElementById('pin-input').value = '';
  showResult(r.employee, r.accounts);
}

function showResult(emp, accounts) {
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';
  document.getElementById('result-avatar').textContent = emp.name ? emp.name[0] : '?';
  document.getElementById('result-name').textContent = emp.name || '';
  document.getElementById('result-dept').textContent = emp.honbu || '';
  renderAccounts(document.getElementById('accounts-list'), accounts);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text || '').then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function backToStep1() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step-admin').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  document.getElementById('pin-input').value = '';
  document.getElementById('admin-pw-input').value = '';
  hideMsg('msg1');
  hideMsg('msg2');
  hideMsg('msg-admin');
}

async function logout() {
  if (isAdmin) await sb.auth.signOut();
  currentUsername = '';
  isAdmin = false;
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('admin-section').style.display = 'none';
  document.getElementById('login-card').style.display = 'block';
  document.getElementById('email-input').value = '';
  document.getElementById('pin-input').value = '';
  document.getElementById('admin-pw-input').value = '';
  document.getElementById('admin-search-input').value = '';
  document.getElementById('admin-emp-list').innerHTML = '';
  document.getElementById('admin-account-view').innerHTML = '';
  document.getElementById('accounts-list').innerHTML = '';
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step-admin').classList.remove('active');
  document.getElementById('step1').classList.add('active');
}
</script>
