<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理本部 統合管理システム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;font-size:14px;background:#f5f5f3;color:#1a1a1a;min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid #e0dfd8;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;}
.topbar-title{font-size:16px;font-weight:600;}
.topbar-sub{font-size:11px;color:#888;margin-top:2px;}
.nav{background:#fff;border-bottom:1px solid #e0dfd8;padding:0 24px;display:flex;position:sticky;top:52px;z-index:99;}
.nav-btn{padding:12px 20px;font-size:13px;color:#666;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:inherit;}
.nav-btn.active{color:#1a1a1a;font-weight:600;border-bottom:2px solid #1a1a1a;}
.nav-btn:hover:not(.active){color:#1a1a1a;background:#f9f9f7;}
.main{padding:24px;max-width:1400px;margin:0 auto;}
.page{display:none;}.page.active{display:block;}
.stats{display:grid;gap:10px;margin-bottom:20px;}
.stat{background:#fff;border:1px solid #e8e7e0;border-radius:10px;padding:14px 16px;}
.stat-label{font-size:11px;color:#888;margin-bottom:4px;}
.stat-value{font-size:22px;font-weight:700;}
.stat-sub{font-size:11px;color:#aaa;margin-top:3px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.b-blue{background:#E6F1FB;color:#0C447C;}
.b-green{background:#EAF3DE;color:#27500A;}
.b-amber{background:#FAEEDA;color:#633806;}
.b-red{background:#FCEBEB;color:#791F1F;}
.b-purple{background:#EEEDFE;color:#3C3489;}
.b-teal{background:#E1F5EE;color:#085041;}
.b-gray{background:#F1EFE8;color:#5F5E5A;}
.b-pink{background:#FBEAF0;color:#72243E;}
.b-sha{background:#e8f4e8;color:#2e7d32;border:1px solid #a5d6a7;}
.b-kojin{background:#fff3e0;color:#e65100;border:1px solid #ffcc80;}
.b-wifi{background:#e8eaf6;color:#3949ab;}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.controls input,.controls select{height:36px;padding:0 12px;border-radius:8px;border:1px solid #d8d7d0;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;}
.controls input{flex:1;min-width:180px;}
.controls input:focus,.controls select:focus{outline:none;border-color:#888;}
.btn{height:36px;padding:0 16px;border-radius:8px;border:1px solid #d8d7d0;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;}
.btn:hover{background:#f5f5f3;}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.btn-primary:hover{background:#333;}
.btn-danger{background:#FCEBEB;color:#791F1F;border-color:#F09595;}
.tbl-wrap{border:1px solid #e8e7e0;border-radius:10px;overflow:auto;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:#f9f9f7;padding:9px 12px;text-align:left;font-weight:600;font-size:11px;color:#666;border-bottom:1px solid #e8e7e0;white-space:nowrap;}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{background:#f0f0ec;color:#1a1a1a;}
thead th.sort-asc,thead th.sort-desc{color:#1a1a1a;background:#ededea;}
.sort-icon{margin-left:4px;font-size:10px;color:#bbb;}
th.sort-asc .sort-icon,th.sort-desc .sort-icon{color:#1a1a1a;}
tbody tr{border-bottom:1px solid #e8e7e0;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#fafaf8;}
tbody td{padding:9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.mono{font-family:monospace;font-size:11px;color:#666;}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.alert-item{background:#fff;border:1px solid #e8e7e0;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:620px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.15);}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid #e8e7e0;display:flex;align-items:center;justify-content:space-between;}
.modal-header h2{font-size:16px;font-weight:600;}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid #e8e7e0;background:#fff;cursor:pointer;font-size:18px;color:#666;}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px;border-top:1px solid #e8e7e0;display:flex;justify-content:space-between;align-items:center;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-row{display:flex;flex-direction:column;gap:4px;}
.form-row.full{grid-column:1/-1;}
.form-row label{font-size:11px;font-weight:600;color:#666;}
.form-row input,.form-row select,.form-row textarea{height:36px;padding:0 12px;border-radius:8px;border:1px solid #d8d7d0;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:#888;}
.form-row textarea{height:72px;padding:10px 12px;resize:none;}
.form-section{font-size:11px;font-weight:600;color:#888;grid-column:1/-1;padding-top:8px;border-top:1px solid #e8e7e0;margin-top:4px;letter-spacing:.05em;}
.detail-panel{background:#fff;border:1px solid #e8e7e0;border-radius:10px;padding:20px;margin-top:14px;}
.device-card{background:#f9f9f7;border-radius:8px;padding:10px 12px;}
.dc-label{font-size:10px;color:#888;margin-bottom:2px;}
.dc-val{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dc-sub{font-size:10px;color:#aaa;margin-top:2px;}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:#888;flex-wrap:wrap;gap:8px;}
.page-btns{display:flex;gap:4px;}
.pg{min-width:30px;height:30px;border-radius:6px;border:1px solid #e8e7e0;background:#fff;cursor:pointer;font-size:12px;padding:0 6px;}
.pg.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.pg:hover:not(.active){background:#f5f5f3;}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.loading{text-align:center;padding:40px;color:#888;font-size:14px;}
.exp-bar{height:4px;background:#e8e7e0;border-radius:2px;overflow:hidden;margin-top:5px;}
.exp-fill{height:100%;border-radius:2px;}
.section-title{font-size:13px;font-weight:600;color:#555;margin:18px 0 8px;}
.tab-bar{display:flex;gap:0;border-bottom:2px solid #e8e7e0;margin-bottom:16px;}
.tab-btn{padding:8px 20px;font-size:13px;color:#888;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;}
.tab-btn.active{color:#1a1a1a;font-weight:600;border-bottom:2px solid #1a1a1a;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">管理本部 統合管理システム</div>
    <div class="topbar-sub">社員 / 機器 / 車両 / リース・レンタル / 携帯・Wi-Fi 一元管理</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="sync-status" style="font-size:11px;color:#aaa"></span>
    <span id="today-label" style="font-size:12px;color:#888"></span>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showPage('dashboard',this)">ダッシュボード</button>
  <button class="nav-btn" onclick="showPage('employees',this)">社員管理</button>
  <button class="nav-btn" onclick="showPage('devices',this)">機器管理</button>
  <button class="nav-btn" onclick="showPage('vehicles',this)">車両管理</button>
  <button class="nav-btn" onclick="showPage('contracts',this)">契約管理</button>
  <button class="nav-btn" onclick="showPage('alerts',this)">期限アラート</button>
  <button class="nav-btn" onclick="showPage('phonebook',this)">電話番号帳</button>
</div>

<div class="main">
  <div id="page-dashboard" class="page active"><div class="loading">読み込み中...</div></div>
  <div id="page-employees" class="page"></div>
  <div id="page-devices" class="page"></div>
  <div id="page-vehicles" class="page"></div>
  <div id="page-contracts" class="page"></div>
  <div id="page-alerts" class="page"></div>
  <div id="page-phonebook" class="page"></div>
</div>

<!-- 社員モーダル -->
<div class="modal-bg" id="emp-modal" onclick="if(event.target===this)closeEmpModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="emp-modal-title">社員登録</h2>
      <button class="modal-close" onclick="closeEmpModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-section">基本情報</div>
        <div class="form-row"><label>氏名 *</label><input id="ef-name" placeholder="山田 太郎"/></div>
        <div class="form-row"><label>ヨミガナ</label><input id="ef-yomi" placeholder="ヤマダ タロウ"/></div>
        <div class="form-row"><label>事業本部</label>
          <select id="ef-honbu">
            <option>建設事業本部</option><option>建設資材事業本部</option><option>エネルギー事業本部</option>
            <option>管理本部</option><option>環境衛生事業本部</option><option>衛生管理部</option>
          </select>
        </div>
        <div class="form-row"><label>部署・課</label><input id="ef-dept" placeholder="工事部 工事課"/></div>
        <div class="form-row"><label>役職</label><input id="ef-role" placeholder="課長"/></div>
        <div class="form-row"><label>性別</label>
          <select id="ef-gender"><option>男</option><option>女</option><option value=""></option></select>
        </div>
        <div class="form-row"><label>入社日</label><input id="ef-join" type="date"/></div>
        <div class="form-row"><label>生年月日</label><input id="ef-bd" type="date"/></div>
        <div class="form-section">連絡先</div>
        <div class="form-row full"><label>メールアドレス</label><input id="ef-email" placeholder="yamada@k-nanwa.co.jp"/></div>
        <div class="form-row"><label>内線番号</label><input id="ef-ext" placeholder="1234"/></div>
        <div class="form-row"><label>直通番号</label><input id="ef-direct" placeholder="099-xxx-xxxx"/></div>
        <div class="form-row full"><label>備考</label><textarea id="ef-note" placeholder="特記事項など"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="ef-del-btn" onclick="deleteEmployee()" style="display:none">削除</button>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="closeEmpModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveEmployee()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 機器モーダル -->
<div class="modal-bg" id="dev-modal" onclick="if(event.target===this)closeDevModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="dev-modal-title">機器登録</h2>
      <button class="modal-close" onclick="closeDevModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-section">機器情報</div>
        <div class="form-row"><label>種別</label>
          <select id="df-type" onchange="toggleDevFields()">
            <option>リース</option><option>レンタル</option><option>携帯</option><option>Wi-Fi</option>
          </select>
        </div>
        <div class="form-row"><label>区分</label>
          <select id="df-ownership">
            <option value="社給">社給</option><option value="個人">個人</option>
          </select>
        </div>
        <div class="form-row"><label>カテゴリ</label>
          <select id="df-cat">
            <option>PC</option><option>ディスプレイ</option><option>複合機</option><option>iPad</option>
            <option>iPhone</option><option>Android</option><option>Wi-Fiルーター</option>
            <option>サーバー</option><option>ソフトウェア</option><option>その他</option>
          </select>
        </div>
        <div class="form-row full"><label>機器名・型番 *</label><input id="df-name" placeholder="ThinkPad L13 Gen4"/></div>
        <div class="form-row"><label>契約番号 / 管理No</label><input id="df-contract" placeholder="L26021575-001"/></div>
        <div class="form-row"><label>資産番号(OIR)</label><input id="df-oir" placeholder="60354848"/></div>
        <div class="form-section">割当・期間</div>
        <div class="form-row"><label>事業本部</label>
          <select id="df-honbu">
            <option value="">未割当</option>
            <option>建設事業本部</option><option>建設資材事業本部</option><option>エネルギー事業本部</option>
            <option>管理本部</option><option>環境衛生事業本部</option><option>衛生管理部</option>
          </select>
        </div>
        <div class="form-row"><label>担当者</label><input id="df-assignee" placeholder="山田 太郎"/></div>
        <div class="form-row"><label>契約開始日</label><input id="df-start" type="date"/></div>
        <div class="form-row"><label>契約終了日</label><input id="df-end" type="date"/></div>
        <div class="form-row"><label>月額（税抜・円）</label><input id="df-monthly" type="number" placeholder="2530"/></div>
        <div class="form-row"><label>リース区分</label>
          <select id="df-ltype"><option value="">通常</option><option>再リース</option><option>延長</option></select>
        </div>
        <!-- 携帯・Wi-Fi専用フィールド -->
        <div class="form-section" id="df-mobile-section" style="display:none">携帯・Wi-Fi情報</div>
        <div class="form-row" id="df-phone-row" style="display:none"><label>電話番号</label><input id="df-phone" placeholder="090-0000-0000"/></div>
        <div class="form-row" id="df-plan-row" style="display:none"><label>プラン名</label><input id="df-plan" placeholder="データ無制限プラン"/></div>
        <div class="form-row" id="df-data-row" style="display:none"><label>データ容量</label><input id="df-data" placeholder="無制限 / 30GB"/></div>
        <div class="form-row full"><label>備考</label><textarea id="df-note" placeholder="設置場所・メモなど"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="df-del-btn" onclick="deleteDevice()" style="display:none">削除</button>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="closeDevModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveDevice()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 車両モーダル -->
<div class="modal-bg" id="veh-modal" onclick="if(event.target===this)closeVehModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="veh-modal-title">車両登録</h2>
      <button class="modal-close" onclick="closeVehModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-section">基本情報</div>
        <div class="form-row"><label>事業本部</label>
          <select id="vf-honbu">
            <option value="">未設定</option>
            <option>建設事業本部</option><option>建設資材事業本部</option><option>エネルギー事業本部</option>
            <option>管理本部</option><option>環境衛生事業本部</option><option>衛生管理部</option>
          </select>
        </div>
        <div class="form-row"><label>使用者</label><input id="vf-assignee" placeholder="山田 太郎"/></div>
        <div class="form-row"><label>所有区分</label>
          <select id="vf-ownership"><option value="社有車">社有車</option><option value="リース">リース</option></select>
        </div>
        <div class="form-row"><label>状態</label>
          <select id="vf-status"><option value="active">使用中</option><option value="returned">返却済み</option></select>
        </div>
        <div class="form-row"><label>メーカー</label><input id="vf-maker" placeholder="トヨタ"/></div>
        <div class="form-row"><label>車種</label><input id="vf-model" placeholder="プロボックス HV"/></div>
        <div class="form-row"><label>車台番号</label><input id="vf-chassis" placeholder="NRE161-0107262"/></div>
        <div class="form-row"><label>初度登録年月</label><input id="vf-firstreg" placeholder="令和7年8月"/></div>
        <div class="form-section">ナンバープレート</div>
        <div class="form-row"><label>地域</label><input id="vf-region" placeholder="鹿児島"/></div>
        <div class="form-row"><label>分類番号</label><input id="vf-class" placeholder="400"/></div>
        <div class="form-row"><label>かな</label><input id="vf-kana" placeholder="な"/></div>
        <div class="form-row"><label>一連番号</label><input id="vf-number" placeholder="3790"/></div>
        <div class="form-section">契約・リース</div>
        <div class="form-row"><label>リース会社</label><input id="vf-leaseco" placeholder="芙蓉オートリース"/></div>
        <div class="form-row"><label>取次店</label><input id="vf-agent" placeholder="ネッツトヨタ鹿児島"/></div>
        <div class="form-row"><label>リース開始日</label><input id="vf-leasestart" type="date"/></div>
        <div class="form-row"><label>リース終了日</label><input id="vf-leaseend" type="date"/></div>
        <div class="form-row"><label>本体価格（円）</label><input id="vf-price" type="number"/></div>
        <div class="form-row"><label>保険（円）</label><input id="vf-insurance" type="number"/></div>
        <div class="form-row"><label>消費税（円）</label><input id="vf-tax" type="number"/></div>
        <div class="form-row"><label>月額合計（円）</label><input id="vf-monthly" type="number"/></div>
        <div class="form-section">車検・点検</div>
        <div class="form-row"><label>車検証有効期間満了日</label><input id="vf-shaken" type="date"/></div>
        <div class="form-row"><label>点検実施日</label><input id="vf-inspdate" type="date"/></div>
        <div class="form-row"><label>点検案内日</label><input id="vf-notice" placeholder="4/23今村課長 LINE"/></div>
        <div class="form-row"><label>点検内容</label><input id="vf-content" placeholder="7/16 車検"/></div>
        <div class="form-row full"><label>備考</label><textarea id="vf-note" placeholder="特記事項など"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="vf-del-btn" onclick="deleteVehicle()" style="display:none">削除</button>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="closeVehModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveVehicle()">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://cicxvcjnvkynhukbnrns.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpY3h2Y2pudmt5bmh1a2Jucm5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNjI4ODYsImV4cCI6MjA5MTYzODg4Nn0.MQs-YYzLJ-gEgvgY7vyw2NGwzqc76TLWIq08GDK8sMQ';

const TODAY=new Date();
document.getElementById('today-label').textContent=
  TODAY.getFullYear()+'年'+(TODAY.getMonth()+1)+'月'+TODAY.getDate()+'日 現在';

const AV_COLORS=[
  {bg:'#E6F1FB',fg:'#0C447C'},{bg:'#E1F5EE',fg:'#085041'},{bg:'#FBEAF0',fg:'#72243E'},
  {bg:'#FAEEDA',fg:'#633806'},{bg:'#EEEDFE',fg:'#3C3489'},{bg:'#FAECE7',fg:'#712B13'},
  {bg:'#EAF3DE',fg:'#27500A'},{bg:'#FCEBEB',fg:'#791F1F'}
];
function avColor(n){let h=0;for(let c of(n||''))h=(h*31+c.charCodeAt(0))&0x7fffffff;return AV_COLORS[h%AV_COLORS.length];}
function initials(n){const p=(n||'').trim().split(/[\s　]+/);return p.length>=2?p[0][0]+p[1][0]:(n||'??').slice(0,2);}

const HB_CLS={'建設事業本部':'b-blue','建設資材事業本部':'b-teal','エネルギー事業本部':'b-amber','管理本部':'b-purple','環境衛生事業本部':'b-green','衛生管理部':'b-pink'};
function hbBadge(h){return `<span class="badge ${HB_CLS[h]||'b-gray'}">${h||'—'}</span>`;}

function leaseStatus(end){
  if(!end||end==='—') return 'none';
  const days=(new Date(end)-TODAY)/86400000;
  if(days<0) return 'danger';
  if(days<=180) return 'warn';
  return 'ok';
}
function lsBadge(end,lt){
  if(lt==='再リース') return '<span class="badge b-purple">再リース中</span>';
  const s=leaseStatus(end);
  if(s==='danger') return '<span class="badge b-red">期限切れ</span>';
  if(s==='warn') return '<span class="badge b-amber">まもなく</span>';
  if(s==='none') return '<span class="badge b-gray">—</span>';
  return '<span class="badge b-green">正常</span>';
}
function remain(end){
  if(!end||end==='—') return '—';
  const days=Math.floor((new Date(end)-TODAY)/86400000);
  if(days<0) return Math.abs(days)+'日超過';
  const m=Math.floor(days/30);
  return m>=12?Math.floor(m/12)+'年'+m%12+'ヶ月':m>0?m+'ヶ月':days+'日';
}
const STATUS_RANK={danger:3,warn:2,ok:1,none:0};
function vehCritical(v){
  const s1=leaseStatus(v.shaken_expiry),s2=leaseStatus(v.lease_end_date);
  if(STATUS_RANK[s1]>=STATUS_RANK[s2]) return {date:v.shaken_expiry,label:'車検',status:s1};
  return {date:v.lease_end_date,label:'リース',status:s2};
}
function vehStatus(v){return vehCritical(v).status;}
function vehBadge(v){
  const c=vehCritical(v);
  if(c.status==='none') return '<span class="badge b-gray">—</span>';
  const map={danger:'b-red',warn:'b-amber',ok:'b-green'};
  const txt={danger:c.label+'期限切れ',warn:c.label+'まもなく',ok:'正常'};
  return `<span class="badge ${map[c.status]}">${txt[c.status]}</span>`;
}
// 検索欄などを再描画しても入力中のフォーカス・カーソル位置・スクロール位置を保持するためのヘルパー
function saveFocus(containerId){
  const el=document.activeElement;
  const container=document.getElementById(containerId);
  if(!el||!container||!container.contains(el)||!el.id) return null;
  return {id:el.id,selStart:el.selectionStart,selEnd:el.selectionEnd,scrollY:window.scrollY};
}
function restoreFocus(saved){
  if(!saved) return;
  const el=document.getElementById(saved.id);
  if(!el) return;
  el.focus();
  if(typeof saved.selStart==='number'&&el.setSelectionRange){
    try{el.setSelectionRange(saved.selStart,saved.selEnd);}catch(e){}
  }
  window.scrollTo(0,saved.scrollY);
}
// 検索欄: IME（日本語入力）のローマ字→かな→漢字変換中に再描画すると、
// 変換の途中でも強制的に確定されてしまう。変換中（isComposing）は
// 一切再描画せず、変換確定（compositionend）後に初めて検索を実行する。
// ローマ字変換を使わない直接入力（英数・かな入力）は従来どおり
// 少し待ってから検索するデバウンス方式のまま。

function setSync(msg,color='#aaa'){const s=document.getElementById('sync-status');s.style.color=color;s.textContent=msg;}

let EMPLOYEES=[],DEVICES=[],VEHICLES=[];

async function loadAll(){
  setSync('読み込み中...','#888');
  const [er,dr,vr]=await Promise.all([
    sb.from('employees').select('*').order('join_date',{ascending:true}),
    sb.from('devices').select('*').order('end_date',{ascending:true,nullsFirst:false}),
    sb.from('vehicles').select('*').order('lease_end_date',{ascending:true,nullsFirst:false})
  ]);
  if(er.error||dr.error||vr.error){setSync('読み込みエラー','#E24B4A');return false;}
  EMPLOYEES=er.data||[];
  DEVICES=dr.data||[];
  VEHICLES=vr.data||[];
  setSync('同期済み ✓','#27500A');
  return true;
}

let currentPage='dashboard';
async function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  currentPage=id;
  await loadAll();
  const renders={dashboard:renderDashboard,employees:renderEmployees,devices:renderDevices,vehicles:renderVehicles,contracts:renderContracts,alerts:renderAlerts,phonebook:renderPhonebook};
  if(renders[id]) renders[id]();
}

function getDevForEmp(name){
  const n=(name||'').replace(/[\s　]/g,'');
  return DEVICES.filter(d=>{const a=(d.assignee||'').replace(/[\s　]/g,'');return a&&(a.includes(n)||n.includes(a));});
}

  document.getElementById('ef-del-btn').style.display=id?'block':'none';
  if(id){
    const e=EMPLOYEES.find(x=>x.id===id);
    document.getElementById('ef-name').value=e.name||'';

    document.getElementById('ef-dept').value=e.dept||'';
    document.getElementById('ef-role').value=e.role||'';
    document.getElementById('ef-gender').value=e.gender||'男';
    document.getElementById('ef-join').value=e.join_date||'';
    document.getElementById('ef-bd').value=e.birthday||'';
    document.getElementById('ef-email').value=e.email||'';
    document.getElementById('ef-ext').value=e.phone_ext||'';
    document.getElementById('ef-direct').value=e.phone_direct||'';
    document.getElementById('ef-note').value=e.note||'';
  } else {
    ['ef-name','ef-yomi','ef-dept','ef-role','ef-join','ef-bd','ef-email','ef-ext','ef-direct','ef-note'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('ef-honbu').selectedIndex=0;
    document.getElementById('ef-gender').selectedIndex=0;
  }
  document.getElementById('emp-modal').classList.add('open');
}
function closeEmpModal(){document.getElementById('emp-modal').classList.remove('open');}

async function saveEmployee(){
  const name=document.getElementById('ef-name').value.trim();
  if(!name){alert('氏名を入力してください');return;}
  const d={name,yomi:document.getElementById('ef-yomi').value.trim()||null,
    honbu:document.getElementById('ef-honbu').value,dept:document.getElementById('ef-dept').value.trim()||null,
    role:document.getElementById('ef-role').value.trim()||null,gender:document.getElementById('ef-gender').value||null,
    join_date:document.getElementById('ef-join').value||null,birthday:document.getElementById('ef-bd').value||null,
    email:document.getElementById('ef-email').value.trim()||null,
    phone_ext:document.getElementById('ef-ext').value.trim()||null,
    phone_direct:document.getElementById('ef-direct').value.trim()||null,
    note:document.getElementById('ef-note').value.trim()||null,updated_at:new Date().toISOString()};
  let err;
  if(empEditId){({error:err}=await sb.from('employees').update(d).eq('id',empEditId));}
  else{({error:err}=await sb.from('employees').insert(d));}
  if(err){alert('保存エラー: '+err.message);return;}
  closeEmpModal();await loadAll();renderEmployees();toast(empEditId?'更新しました':'登録しました');
}

async function deleteEmployee(){
  const e=EMPLOYEES.find(x=>x.id===empEditId);
  if(!confirm((e?.name||'この社員')+'を削除しますか？'))return;
  const {error}=await sb.from('employees').delete().eq('id',empEditId);
  if(error){alert('削除エラー: '+error.message);return;}
  closeEmpModal();await loadAll();renderEmployees();toast('削除しました');
}

    const mq=!devQ||d.name.toLowerCase().includes(devQ.toLowerCase())||(d.contract_no||'').includes(devQ)||(d.assignee||'').includes(devQ)||(d.oir_no||'').includes(devQ);
    return mq&&(!devType||d.type===devType)&&(!devHonbu||d.honbu===devHonbu)&&(!devStatus||leaseStatus(d.end_date)===devStatus);
  });
  const pages=Math.max(1,Math.ceil(filtered.length/DEV_PER));
  if(devPage>pages)devPage=pages;
  const slice=filtered.slice((devPage-1)*DEV_PER,devPage*DEV_PER);
  const honbus=[...new Set(DEVICES.map(d=>d.honbu).filter(Boolean))];
  const _focus=saveFocus('page-devices');
  document.getElementById('page-devices').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div style="font-size:20px;font-weight:700">機器管理</div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="exportDevCSV()">CSVエクスポート</button>
        <button class="btn btn-primary" onclick="openDevModal(null)">＋ 機器登録</button>
      </div>
    </div>
    <div class="stats" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat"><div class="stat-label">総機器数</div><div class="stat-value">${DEVICES.length}</div></div>
      <div class="stat"><div class="stat-label">リース</div><div class="stat-value">${DEVICES.filter(d=>d.type==='リース').length}</div></div>
      <div class="stat"><div class="stat-label">レンタル</div><div class="stat-value">${DEVICES.filter(d=>d.type==='レンタル').length}</div></div>
      <div class="stat"><div class="stat-label">携帯</div><div class="stat-value">${DEVICES.filter(d=>d.type==='携帯').length}</div></div>
      <div class="stat"><div class="stat-label">Wi-Fi</div><div class="stat-value">${DEVICES.filter(d=>d.type==='Wi-Fi').length}</div></div>
    </div>
    <div class="controls">
      <input id="dev-search" type="text" placeholder="機器名・契約番号・担当者・資産番号で検索..." value="${devQ}" oninput="devSearchInput(this.value)"/>
      <select onchange="devType=this.value;devPage=1;renderDevices()">
        <option value="">全種別</option>
        <option${devType==='リース'?' selected':''}>リース</option>
        <option${devType==='レンタル'?' selected':''}>レンタル</option>
        <option${devType==='携帯'?' selected':''}>携帯</option>
        <option${devType==='Wi-Fi'?' selected':''}>Wi-Fi</option>
      </select>
      <select onchange="devHonbu=this.value;devPage=1;renderDevices()">
        <option value="">全事業本部</option>
        ${honbus.map(h=>`<option value="${h}"${devHonbu===h?' selected':''}>${h}</option>`).join('')}
      </select>
      <select onchange="devStatus=this.value;devPage=1;renderDevices()">
        <option value="">全ステータス</option>
        <option value="danger"${devStatus==='danger'?' selected':''}>期限切れ</option>
        <option value="warn"${devStatus==='warn'?' selected':''}>6ヶ月以内</option>
        <option value="ok"${devStatus==='ok'?' selected':''}>正常</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>種別</th><th>区分</th><th>カテゴリ</th><th>機器名</th><th>契約番号/管理No</th>
          <th>担当者</th><th>事業本部</th><th>開始日</th><th>終了日</th><th>残期間</th><th>状態</th><th>月額</th>
          <th style="width:60px"></th>
        </tr></thead>
        <tbody>${slice.map(d=>`<tr>
          <td><span class="badge ${d.type==='リース'?'b-purple':d.type==='レンタル'?'b-teal':d.type==='Wi-Fi'?'b-wifi':'b-blue'}">${d.type}</span></td>
          <td><span class="badge ${(d.ownership||'社給')==='個人'?'b-kojin':'b-sha'}">${d.ownership||'社給'}</span></td>
          <td style="font-size:11px">${d.category||''}</td>
          <td style="font-weight:600">${d.name}</td>
          <td class="mono">${d.contract_no||'—'}</td>
          <td>${d.assignee||'<span style="color:#ccc">未割当</span>'}</td>
          <td>${hbBadge(d.honbu)}</td>
          <td class="mono">${d.start_date||'—'}</td>
          <td class="mono">${d.end_date||'—'}</td>
          <td style="font-size:12px">${remain(d.end_date)}</td>
          <td>${lsBadge(d.end_date,d.lease_type)}</td>
          <td style="text-align:right;font-family:monospace;font-size:11px">${d.monthly?Number(d.monthly).toLocaleString():'—'}</td>
          <td><button class="btn" style="height:28px;padding:0 10px;font-size:11px" onclick="openDevModal('${d.id}')">編集</button></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="pagination">
      <span>${filtered.length}件（${(devPage-1)*DEV_PER+1}〜${Math.min(devPage*DEV_PER,filtered.length)}件表示）</span>
      <div class="page-btns">${renderPager(pages,devPage,'devPage','renderDevices')}</div>
    </div>
  `;
  restoreFocus(_focus);
}

function toggleDevFields(){
  const t=document.getElementById('df-type').value;
  const isMobile=t==='携帯'||t==='Wi-Fi';
  document.getElementById('df-mobile-section').style.display=isMobile?'':'none';
  document.getElementById('df-phone-row').style.display=t==='携帯'?'':'none';
  document.getElementById('df-plan-row').style.display=isMobile?'':'none';
  document.getElementById('df-data-row').style.display=isMobile?'':'none';
}

async function saveDevice(){
  const name=document.getElementById('df-name').value.trim();
  if(!name){alert('機器名を入力してください');return;}
  const d={type:document.getElementById('df-type').value,
    ownership:document.getElementById('df-ownership').value,
    category:document.getElementById('df-cat').value,
    name,contract_no:document.getElementById('df-contract').value.trim()||null,
    oir_no:document.getElementById('df-oir').value.trim()||null,
    honbu:document.getElementById('df-honbu').value||null,
    assignee:document.getElementById('df-assignee').value.trim()||null,
    start_date:document.getElementById('df-start').value||null,
    end_date:document.getElementById('df-end').value||null,
    monthly:parseInt(document.getElementById('df-monthly').value)||0,
    lease_type:document.getElementById('df-ltype').value||null,
    phone:document.getElementById('df-phone').value.trim()||null,
    plan:document.getElementById('df-plan').value.trim()||null,
    data_capacity:document.getElementById('df-data').value.trim()||null,
    note:document.getElementById('df-note').value.trim()||null,
    updated_at:new Date().toISOString()};
  let err;
  if(devEditId){({error:err}=await sb.from('devices').update(d).eq('id',devEditId));}
  else{({error:err}=await sb.from('devices').insert(d));}
  if(err){alert('保存エラー: '+err.message);return;}
  closeDevModal();await loadAll();renderDevices();toast(devEditId?'更新しました':'登録しました');
}

async function deleteDevice(){
  const d=DEVICES.find(x=>x.id===devEditId);
  if(!confirm((d?.name||'この機器')+'を削除しますか？'))return;
  const {error}=await sb.from('devices').delete().eq('id',devEditId);
  if(error){alert('削除エラー: '+error.message);return;}
  closeDevModal();await loadAll();renderDevices();toast('削除しました');
}

function exportDevCSV(){
  const h=['種別','区分','カテゴリ','機器名','契約番号','資産番号(OIR)','担当者','事業本部','開始日','終了日','月額','プラン','データ容量','備考'];
  const rows=DEVICES.map(d=>[d.type,d.ownership||'社給',d.category,d.name,d.contract_no,d.oir_no,d.assignee,d.honbu,d.start_date,d.end_date,d.monthly,d.plan,d.data_capacity,d.note]);
  const csv=[h,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='機器管理一覧.csv';a.click();
}

function renderContracts(){
  const lease=DEVICES.filter(d=>d.type==='リース').sort((a,b)=>new Date(a.end_date||'9999')-new Date(b.end_date||'9999'));
  const rental=DEVICES.filter(d=>d.type==='レンタル').sort((a,b)=>new Date(a.end_date||'9999')-new Date(b.end_date||'9999'));

// ── 期限アラート ──
function renderAlerts(){
  const activeVeh=VEHICLES.filter(v=>v.status!=='returned');
  const danger=[...DEVICES.filter(d=>leaseStatus(d.end_date)==='danger'),...activeVeh.filter(v=>vehStatus(v)==='danger')]
    .sort((a,b)=>new Date((a.end_date!==undefined?a.end_date:vehCritical(a).date))-new Date((b.end_date!==undefined?b.end_date:vehCritical(b).date)));
  const warn=[...DEVICES.filter(d=>leaseStatus(d.end_date)==='warn'),...activeVeh.filter(v=>vehStatus(v)==='warn')]
    .sort((a,b)=>new Date((a.end_date!==undefined?a.end_date:vehCritical(a).date))-new Date((b.end_date!==undefined?b.end_date:vehCritical(b).date)));
  const okCount=DEVICES.filter(d=>leaseStatus(d.end_date)==='ok').length+activeVeh.filter(v=>vehStatus(v)==='ok').length;
  const makeList=(items,color,title)=>`
    <div class="section-title" style="color:${color}">${title}（${items.length}件）</div>
    ${items.length?items.map(x=>{
      const isVeh=x.end_date===undefined;
      const d=isVeh?vehCritical(x).date:x.end_date;
      const label=isVeh?(x.model||x.maker||'車両')+'（'+(x.assignee||'未割当')+'）':x.name;
      const typeTxt=isVeh?'車両・'+vehCritical(x).label:x.type;
      const typeCls=isVeh?'b-green':(x.type==='リース'?'b-purple':x.type==='レンタル'?'b-teal':x.type==='Wi-Fi'?'b-wifi':'b-blue');
      return `<div class="alert-item">
      <div class="alert-dot" style="background:${color}"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${label}</div>
        <div style="font-size:11px;color:#888;margin-top:3px">
          <span class="badge ${typeCls}">${typeTxt}</span>
          &nbsp;${isVeh?vehPlateStr(x):(x.contract_no||'—')}&nbsp;/&nbsp;${hbBadge(x.honbu||'—')}&nbsp;/&nbsp;担当：${x.assignee||'未割当'}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;padding-left:16px">
        <div style="font-size:14px;font-weight:700;color:${color}">${remain(d)}</div>
        <div style="font-size:11px;color:#aaa">${d||''}</div>
      </div>
    </div>`;
    }).join(''):`<div style="font-size:12px;color:#aaa;padding:10px 0">該当なし</div>`}`;
  document.getElementById('page-alerts').innerHTML=`
    <div style="font-size:20px;font-weight:700;margin-bottom:14px">期限アラート</div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="stat-label" style="color:#a32d2d">期限切れ</div><div class="stat-value" style="color:#a32d2d">${danger.length}件</div><div class="stat-sub">要対応（機器＋車両）</div></div>
      <div class="stat"><div class="stat-label" style="color:#854f0b">6ヶ月以内満了</div><div class="stat-value" style="color:#854f0b">${warn.length}件</div><div class="stat-sub">更新要検討（機器＋車両）</div></div>
      <div class="stat"><div class="stat-label">問題なし</div><div class="stat-value">${okCount}件</div></div>
    </div>
    ${makeList(danger,'#E24B4A','期限切れ — 要対応')}
    ${makeList(warn,'#BA7517','6ヶ月以内に満了')}
  `;
}

// ── ページャー ──
function renderPager(pages,current,varName,renderFn){
  let h='';
  if(current>1) h+=`<button class="pg" onclick="${varName}=${current-1};${renderFn}()">‹</button>`;
  for(let i=1;i<=pages;i++){
    if(pages<=7||i===1||i===pages||Math.abs(i-current)<=1) h+=`<button class="pg${i===current?' active':''}" onclick="${varName}=${i};${renderFn}()">${i}</button>`;
    else if(Math.abs(i-current)===2) h+=`<button class="pg" style="border:none;cursor:default;color:#ccc">…</button>`;
  }
  if(current<pages) h+=`<button class="pg" onclick="${varName}=${current+1};${renderFn}()">›</button>`;
  return h;
}

// ── 電話番号帳（管理画面用：社給＋個人、携帯＋Wi-Fi） ──
let pbQ='',pbHonbu='',pbOwnership='',pbTab='mobile';
let pbSortCol='honbu',pbSortDir=1;  // ソート状態

// ソートキーに対応するデータ値を返す
function pbSortVal(d,col){
  switch(col){
    case 'honbu':    return d.honbu||'';
    case 'assignee': return d.yomi||d.assignee||'';
    case 'ownership':return d.ownership||'社給';
    case 'category': return d.category||'';
    case 'name':     return d.name||'';
    case 'contract_no': return d.contract_no||'';
    case 'phone':    return d.phone||'';
    case 'plan':     return d.plan||'';
    case 'data_capacity': return d.data_capacity||'';
    case 'start_date':   return d.start_date||'';
    case 'end_date':     return d.end_date||'';
    default: return '';
  }
}

function pbSetSort(col){
  if(pbSortCol===col) pbSortDir=-pbSortDir;
  else { pbSortCol=col; pbSortDir=1; }
  renderPhonebook();
}

function pbThIcon(col){
  const active=pbSortCol===col;
  const cls='sortable'+(active?(pbSortDir===1?' sort-asc':' sort-desc'):'');
  const icon=active?(pbSortDir===1?'▲':'▼'):'⇅';
  return `class="${cls}" onclick="pbSetSort('${col}')">${col!=='honbu'?'':''}<span class="sort-icon">${icon}</span`;
}

// ソートアイコン付き <th> を生成するヘルパー
function pbTh(label,col){
  const active=pbSortCol===col;
  const cls='sortable'+(active?(pbSortDir===1?' sort-asc':' sort-desc'):'');
  const icon=active?(pbSortDir===1?'▲':'▼'):'⇅';
  return `<th class="${cls}" onclick="pbSetSort('${col}')">${label} <span class="sort-icon">${icon}</span></th>`;
}

function renderPhonebook(){
  const allMobile=DEVICES.filter(d=>d.type==='携帯');
  const allWifi=DEVICES.filter(d=>d.type==='Wi-Fi');
  const isMobile=pbTab==='mobile';
  const items=(isMobile?allMobile:allWifi).filter(d=>{
    const mq=!pbQ||(d.assignee||'').includes(pbQ)||(d.phone||'').includes(pbQ)||(d.honbu||'').includes(pbQ)||(d.yomi||'').includes(pbQ);
    const mh=!pbHonbu||d.honbu===pbHonbu;
    const mo=!pbOwnership||(d.ownership||'社給')===pbOwnership;
    return mq&&mh&&mo;
  }).sort((a,b)=>{
    const va=pbSortVal(a,pbSortCol);
    const vb=pbSortVal(b,pbSortCol);
    // 日付列は文字列比較でOK（YYYY-MM-DD形式）
    const cmp=va.localeCompare(vb,'ja',{numeric:true});
    return cmp*pbSortDir;
  });
  const honbus=[...new Set([...allMobile,...allWifi].map(d=>d.honbu).filter(Boolean))];
  const _focus=saveFocus('page-phonebook');
  document.getElementById('page-phonebook').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div>
        <div style="font-size:20px;font-weight:700">電話番号帳</div>
        <div style="font-size:12px;color:#888;margin-top:3px">社給・個人 — 携帯・Wi-Fi管理</div>
      </div>
      <button class="btn" onclick="exportPhoneCSV()">CSVエクスポート</button>
    </div>
    <div class="tab-bar">
      <button class="tab-btn${pbTab==='mobile'?' active':''}" onclick="pbTab='mobile';pbSortCol='honbu';pbSortDir=1;renderPhonebook()">📱 携帯（${allMobile.length}件）</button>
      <button class="tab-btn${pbTab==='wifi'?' active':''}" onclick="pbTab='wifi';pbSortCol='honbu';pbSortDir=1;renderPhonebook()">📡 Wi-Fiルーター（${allWifi.length}件）</button>
    </div>
    <div class="controls">
      <input id="pb-search" type="text" placeholder="担当者名・電話番号・事業本部で検索..." value="${pbQ}" oninput="pbSearchInput(this.value)"/>
      <select onchange="pbHonbu=this.value;renderPhonebook()">
        <option value="">全事業本部</option>
        ${honbus.map(h=>`<option value="${h}"${pbHonbu===h?' selected':''}>${h}</option>`).join('')}
      </select>
      <select onchange="pbOwnership=this.value;renderPhonebook()">
        <option value="">社給＋個人</option>
        <option value="社給"${pbOwnership==='社給'?' selected':''}>社給のみ</option>
        <option value="個人"${pbOwnership==='個人'?' selected':''}>個人のみ</option>
      </select>
    </div>
    <div style="font-size:12px;color:#888;margin-bottom:8px">${items.length}件表示</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          ${pbTh('事業本部','honbu')}
          ${pbTh('担当者','assignee')}
          ${pbTh('区分','ownership')}
          ${pbTh('カテゴリ','category')}
          ${pbTh('機種名','name')}
          ${pbTh('管理No','contract_no')}
          ${isMobile?pbTh('電話番号','phone'):''}
          ${pbTh('プラン','plan')}
          ${pbTh('データ容量','data_capacity')}
          ${pbTh('契約開始','start_date')}
          ${pbTh('契約終了','end_date')}
          <th>状態</th>
        </tr></thead>
        <tbody>${items.length?items.map(d=>`<tr>
          <td>${hbBadge(d.honbu)}</td>
          <td style="font-weight:600">${d.assignee||'<span style="color:#ccc">未割当</span>'}</td>
          <td><span class="badge ${(d.ownership||'社給')==='個人'?'b-kojin':'b-sha'}">${d.ownership||'社給'}</span></td>
          <td><span class="badge ${d.category==='iPhone'?'b-blue':d.category==='Android'?'b-green':'b-wifi'}">${d.category||'—'}</span></td>
          <td style="font-size:12px">${d.name||'—'}</td>
          <td class="mono">${d.contract_no||'—'}</td>
          ${isMobile?`<td><span style="font-family:monospace;font-size:13px;font-weight:600">${d.phone||'—'}</span></td>`:''}
          <td style="font-size:11px">${d.plan||'—'}</td>
          <td style="font-size:11px">${d.data_capacity||'—'}</td>
          <td class="mono">${d.start_date||'—'}</td>
          <td class="mono">${d.end_date||'—'}</td>
          <td>${lsBadge(d.end_date,d.lease_type)}</td>
        </tr>`).join(''):`<tr><td colspan="${isMobile?12:11}" style="text-align:center;padding:2.5rem;color:#aaa">該当なし</td></tr>`}</tbody>
      </table>
    </div>
  `;
  restoreFocus(_focus);
}

function exportPhoneCSV(){
  const items=DEVICES.filter(d=>d.type===(pbTab==='mobile'?'携帯':'Wi-Fi'));
  const h=['事業本部','担当者','区分','カテゴリ','機種名','管理No','電話番号','プラン','データ容量','契約開始','契約終了'];
  const rows=items.map(d=>[d.honbu,d.assignee,d.ownership||'社給',d.category,d.name,d.contract_no,d.phone||'',d.plan||'',d.data_capacity||'',d.start_date||'',d.end_date||'']);
  const csv=[h,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download=pbTab==='mobile'?'携帯一覧.csv':'WiFi一覧.csv';
  a.click();
}

// ── IME変換中の検索欄再描画防止（delegation） ──
// inline属性のoncompositionstart/endはブラウザによって発火が不安定なため、
// 常に存在するdocumentへイベント委譲することで確実に検知する。
const COMP_MAP={'emp-search':['empCompStart','empCompEnd'],'dev-search':['devCompStart','devCompEnd'],
  'veh-search':['vehCompStart','vehCompEnd'],'pb-search':['pbCompStart','pbCompEnd']};
document.addEventListener('compositionstart',e=>{
  const m=COMP_MAP[e.target && e.target.id];
  if(m) window[m[0]]();
});
document.addEventListener('compositionend',e=>{
  const m=COMP_MAP[e.target && e.target.id];
  if(m) window[m[1]](e.target);
});
