<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>座席表 | 管理本部 統合管理システム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* 配色・書体は管理システム（index.html / phonebook.html）に合わせています */
:root{
  --bg:#f5f5f3; --paper:#fcfcfb; --grid:#ecebe6; --wall:#3a4250; --fg:#1a1a1a; --muted:#777; --line:#e0dfd8;
  --seat:#ffffff; --accent:#1a2d5a; --accent-fg:#fff; --hl:#e09a2e; --danger:#a32d2d; --panel:#fff;
  --font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;min-height:52px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar-title{font-size:16px;font-weight:600}
.topbar-sub{font-size:11px;color:#888}
.topbar .back{margin-left:auto;font-size:12px;color:var(--accent);text-decoration:none}
.topbar .back:hover{text-decoration:underline}
.user-chip{font-size:12px;color:#555}

.app{max-width:1240px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:12px}
@media(max-width:600px){.app{padding:12px 16px 32px}.topbar{padding:8px 16px}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.floors{display:flex;gap:4px;margin-right:auto}
.floors button{border:1px solid var(--line);background:#fff;padding:6px 16px;border-radius:var(--r);cursor:pointer;display:flex;align-items:baseline;gap:8px;color:#555}
.floors button .fl{font-size:16px;font-weight:700}
.floors button .ct{font-size:11px;color:#999}
.floors button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.floors button[aria-pressed="true"] .ct{color:#c9d2e6}
.search{position:relative;flex:1 1 240px;max-width:340px;min-width:0}
.search input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:var(--r);background:#fff}
#results{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);list-style:none;padding:4px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgb(0 0 0 / .12);max-height:360px;overflow:auto}
#results button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:6px 8px;cursor:pointer}
#results button:hover,#results button:focus-visible{background:var(--bg)}
#results .sub{grid-column:1/-1;font-size:11px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#bbb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--danger);border-color:#e7c3c3}
.btn.danger[data-armed]{background:var(--danger);color:#fff;border-color:var(--danger)}
#editBtn[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--accent);border-radius:var(--r);background:#eef1f7}
.toolbar .tip{font-size:12px;color:#555;margin-right:auto}

.planwrap{overflow:auto;border-radius:var(--r);min-width:0}
.sizer{position:relative}
.plan{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;background:var(--paper);border:4px solid var(--wall);border-radius:2px}
.plan.editing{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.area{position:absolute;border:1.5px dashed #aaa;border-radius:3px;background:rgb(0 0 0 / .025)}
.alabel{position:absolute;left:8px;top:5px;font-size:12px;font-weight:700;letter-spacing:.08em;color:#888}
.seat{position:absolute;width:104px;height:56px;padding:6px 8px;border-radius:4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;
  --dc:#999;background:color-mix(in srgb,var(--dc) 12%,#fff);border:1.5px solid color-mix(in srgb,var(--dc) 60%,#fff)}
.seat .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ext{font-family:var(--mono);font-size:12px;color:#666}
.seat.empty{background:transparent;border-style:dashed;border-color:#ccc}
.seat.empty .nm{font-weight:400;color:#999;font-size:12px}
.seat:hover{box-shadow:0 2px 8px rgb(0 0 0 / .15)}
.seat.sel,.area.sel{outline:3px solid var(--accent);outline-offset:1px}
.seat.hl{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--hl) 55%,transparent)}}
.editing .seat,.editing .area{cursor:grab;touch-action:none}
.editing .area{border-color:var(--accent)}
.rz{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;background:var(--accent);border:2px solid var(--paper);border-radius:3px;cursor:nwse-resize}
.dragging{opacity:.85;cursor:grabbing!important;z-index:5}
.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:24px}
.empty-state strong{font-size:16px;color:var(--fg)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:#666}
.legend .stat{margin-right:auto;color:var(--fg)}
.legend .stat b{font-family:var(--mono)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dc,#999);margin-right:6px;flex:none}

.sheet{position:fixed;z-index:30;right:16px;top:16px;bottom:16px;width:360px;max-width:calc(100% - 32px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgb(0 0 0 / .18);padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
@media(max-width:640px){.sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;max-height:75%;border-radius:14px 14px 0 0}}
.sh-bar{display:flex;align-items:center;justify-content:space-between}
.sh-kicker{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.sheet h2{font-size:22px}
.kana{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:6px;background:var(--dc,#999);color:#fff}
.chip.light{color:#5a3d00}
.dept{font-size:12px;color:#555;margin-left:6px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row dt{font-size:12px;color:var(--muted)}
.row dd{min-width:0;overflow-wrap:anywhere}
.row .val{font-size:15px;user-select:all}
.row a.val{color:var(--accent);text-decoration:none}
.copy{border:1px solid var(--line);background:none;border-radius:4px;font-size:12px;padding:3px 8px;cursor:pointer}
.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:var(--r);background:#fff}
.field select[size]{padding:4px}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.toast{position:fixed;z-index:40;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;max-width:calc(100% - 32px)}

.login{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h2{font-size:18px}
.login .err{font-size:12px;color:var(--danger)}
@media (prefers-reduced-motion:reduce){.seat.hl{animation:none;box-shadow:0 0 0 4px var(--hl)}}
</style>
</head>
<body>
<header class="topbar">
  <div><div class="topbar-title">座席表</div><div class="topbar-sub">本社 2F・3F・4F</div></div>
  <span class="user-chip" id="userChip"></span>
  <a class="back" href="index.html">← 管理システムへ</a>
</header>

<div id="loginView" hidden>
  <form class="login" id="loginForm">
    <h2>ログイン</h2>
    <p class="hint">管理システムと同じメールアドレス・パスワードでログインしてください。</p>
    <div class="field"><label class="lbl" for="li-email">メールアドレス</label><input id="li-email" type="email" autocomplete="username"></div>
    <div class="field"><label class="lbl" for="li-pw">パスワード</label><input id="li-pw" type="password" autocomplete="current-password"></div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn primary" type="submit">ログイン</button>
  </form>
</div>

<div id="noticeView" hidden><div class="login"><h2>座席表</h2><p class="hint"></p><a class="btn" href="index.html" style="text-align:center;text-decoration:none">管理システムへ戻る</a></div></div>

<div class="app" id="appView" hidden>
  <div class="bar">
    <nav class="floors" id="floors" aria-label="フロア"></nav>
    <div class="search">
      <label for="q" class="sr">氏名・ふりがな・部署・内線で検索</label>
      <input id="q" type="search" placeholder="氏名・ふりがな・部署・内線で検索" autocomplete="off">
      <ul id="results" hidden></ul>
    </div>
    <button id="editBtn" class="btn" type="button" aria-pressed="false" hidden>編集モード</button>
  </div>
  <div class="toolbar" id="toolbar" hidden>
    <span class="tip">席・エリアはドラッグで移動、クリックで設定。社員の追加・変更は「社員管理」、携帯番号は「機器管理」で行います。</span>
    <button class="btn" id="addSeat" type="button">＋座席</button>
    <button class="btn" id="addArea" type="button">＋エリア</button>
  </div>
  <div class="planwrap" id="wrap"><div class="sizer" id="sizer"><div class="plan" id="plan"></div></div></div>
  <div class="legend" id="legend"></div>
</div>
<aside id="sheet" class="sheet" hidden></aside>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const SUPABASE_URL='https://cicxvcjnvkynhukbnrns.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpY3h2Y2pudmt5bmh1a2Jucm5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNjI4ODYsImV4cCI6MjA5MTYzODg4Nn0.MQs-YYzLJ-gEgvgY7vyw2NGwzqc76TLWIq08GDK8sMQ';
// index.html と同じ設定にして、ログイン状態を共有します
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const FLOORS=["2F","3F","4F"], W=1000, H=640, SW=104, SH=56, GRID=8;
// 事業本部の色（電話番号帳のバッジと同じ）
const HB_COLOR={'管理本部':'#1a2d5a','エネルギー事業本部':'#d4a900','環境衛生事業本部':'#1a6fc4','衛生管理部':'#d94040','建設事業本部':'#2e7d32','建設資材事業本部':'#0097a7'};
const S={seats:[],areas:[],people:[],loaded:false,floor:"2F",edit:false,canEdit:false,sheet:null,hl:null};
let scale=1,drag=null,pendingRender=false,suppressClick=false;
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(v==null||v===false)continue;if(k==="class")el.className=v;else if(k==="style")el.style.cssText=v;else if(k==="text")el.textContent=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v);}for(const c of kids.flat(3)){if(c==null||c===false)continue;el.append(c.nodeType?c:String(c));}return el;}
const snap=v=>Math.round(v/GRID)*GRID, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const norm=v=>String(v||"").replace(/[\s　]/g,"").toLowerCase();
try{const f=localStorage.getItem("seat-floor");if(FLOORS.includes(f))S.floor=f;}catch(e){}

/* ---------- data ---------- */
async function loadAll(){
  const [s,a,p]=await Promise.all([
    sb.from('seats').select('id,floor,x,y'),
    sb.from('seat_areas').select('id,floor,x,y,w,h,label'),
    sb.rpc('seat_directory')
  ]);
  const err=s.error||a.error||p.error;
  if(err){console.error(err);toast("データの読み込みに失敗しました。再読み込みしてください");return false;}
  S.seats=s.data||[];S.areas=a.data||[];S.people=(p.data||[]).map(x=>({...x,id:String(x.id)}));S.loaded=true;
  render();return true;
}
async function write(promise,okMsg){
  const {error}=await promise;
  if(error){console.error(error);toast(/権限/.test(error.message||"")||error.code==="42501"?"変更する権限がありません":"保存できませんでした。もう一度お試しください");await loadAll();return false;}
  if(okMsg)toast(okMsg);
  await loadAll();return true;
}

function derive(){
  const seatById=Object.fromEntries(S.seats.map(s=>[s.id,s])),bySeat={};
  for(const p of S.people)if(p.seat_id&&seatById[p.seat_id])bySeat[p.seat_id]=p;
  const seatNo={};
  for(const f of FLOORS)S.seats.filter(s=>s.floor===f).sort((a,b)=>a.y-b.y||a.x-b.x).forEach((s,i)=>seatNo[s.id]=i+1);
  return{seatById,bySeat,seatNo};
}
const hbStyle=hb=>`--dc:${HB_COLOR[hb]||'#888'}`;
const seatOf=(p,D)=>p.seat_id?D.seatById[p.seat_id]||null:null;

/* ---------- render ---------- */
function render(){if(drag){pendingRender=true;return;}renderTabs();renderPlan();renderLegend();if(S.sheet&&S.sheet.mode==="detail")renderSheet();}
function renderTabs(){
  const D=derive(),nav=$("#floors");nav.replaceChildren();
  for(const f of FLOORS){const n=S.seats.filter(s=>s.floor===f&&D.bySeat[s.id]).length;
    nav.append(h("button",{type:"button","aria-pressed":String(S.floor===f),onclick:()=>setFloor(f)},h("span",{class:"fl",text:f}),h("span",{class:"ct",text:S.loaded?`${n}名`:""})));}
}
function setFloor(f){S.floor=f;try{localStorage.setItem("seat-floor",f)}catch(e){}closeSheet();render();}
function selected(kind,id){const sh=S.sheet;if(!sh)return false;
  if(kind==="area")return sh.mode==="area"&&sh.id===id;
  if(sh.mode==="seat")return sh.id===id;
  if(sh.mode==="detail"){const p=S.people.find(x=>x.id===sh.id);return!!p&&p.seat_id===id;}
  return false;}
function renderPlan(){
  const D=derive(),plan=$("#plan");plan.replaceChildren();plan.classList.toggle("editing",S.edit);
  const areas=S.areas.filter(a=>a.floor===S.floor),seats=S.seats.filter(s=>s.floor===S.floor);
  for(const a of areas)plan.append(h("div",{class:"area"+(selected("area",a.id)?" sel":""),"data-id":a.id,style:`left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px`},
    h("span",{class:"alabel",text:a.label||"エリア"}),S.edit?h("span",{class:"rz","aria-hidden":"true"}):null));
  for(const s of seats){const p=D.bySeat[s.id];
    plan.append(h("button",{type:"button",class:"seat"+(p?"":" empty")+(S.hl===s.id?" hl":"")+(selected("seat",s.id)?" sel":""),"data-id":s.id,
      style:`left:${s.x}px;top:${s.y}px;${p?hbStyle(p.honbu):""}`,"aria-label":p?`${p.name} 内線 ${p.phone_ext||"なし"}`:`空席 ${s.floor} 席${D.seatNo[s.id]}`},
      p?[h("span",{class:"nm",text:p.name}),h("span",{class:"ext",text:"内線 "+(p.phone_ext||"—")})]:h("span",{class:"nm",text:"空席"})));}
  if(!areas.length&&!seats.length)plan.append(h("div",{class:"empty-state"},
    h("strong",{text:S.loaded?`${S.floor} の座席はまだ登録されていません`:"読み込み中…"}),
    S.loaded?h("span",{text:S.canEdit?"「編集モード」→「＋座席」で席を追加できます。":"管理本部が座席を登録すると、ここに表示されます。"}):null));
}
function renderLegend(){
  const D=derive(),el=$("#legend");el.replaceChildren();if(!S.loaded)return;
  const seats=S.seats.filter(s=>s.floor===S.floor),used=seats.filter(s=>D.bySeat[s.id]);
  el.append(h("span",{class:"stat"},`${S.floor}：席 `,h("b",{text:seats.length}),"　在席 ",h("b",{text:used.length}),"　空席 ",h("b",{text:seats.length-used.length})));
  const hbs=[...new Set(used.map(s=>D.bySeat[s.id].honbu).filter(Boolean))];
  for(const b of hbs)el.append(h("span",{},h("span",{class:"dot",style:hbStyle(b)}),b));
}

/* ---------- scale ---------- */
function fit(){const cw=$("#wrap").clientWidth||W;scale=Math.max(.62,Math.min(1.15,cw/W));$("#plan").style.transform=`scale(${scale})`;$("#sizer").style.width=W*scale+"px";$("#sizer").style.height=H*scale+"px";}
new ResizeObserver(fit).observe($("#wrap"));

/* ---------- plan interaction ---------- */
const plan=$("#plan");
plan.addEventListener("pointerdown",e=>{
  if(!S.edit||e.button!==0)return;const t=e.target.closest(".seat,.area");if(!t)return;
  const kind=t.classList.contains("seat")?"seats":"seat_areas",item=(kind==="seats"?S.seats:S.areas).find(x=>x.id===t.dataset.id);if(!item)return;
  drag={el:t,kind,item,rz:!!e.target.closest(".rz"),sx:e.clientX,sy:e.clientY,ox:item.x,oy:item.y,ow:item.w||SW,oh:item.h||SH,moved:false};
  t.setPointerCapture(e.pointerId);e.preventDefault();
});
plan.addEventListener("pointermove",e=>{
  if(!drag)return;const dx=(e.clientX-drag.sx)/scale,dy=(e.clientY-drag.sy)/scale;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return;
  drag.moved=true;drag.el.classList.add("dragging");
  if(drag.rz){drag.nw=snap(clamp(drag.ow+dx,80,W-8-drag.ox));drag.nh=snap(clamp(drag.oh+dy,48,H-8-drag.oy));drag.el.style.width=drag.nw+"px";drag.el.style.height=drag.nh+"px";}
  else{drag.nx=snap(clamp(drag.ox+dx,0,W-8-drag.ow));drag.ny=snap(clamp(drag.oy+dy,0,H-8-drag.oh));drag.el.style.left=drag.nx+"px";drag.el.style.top=drag.ny+"px";}
});
async function endDrag(){
  if(!drag)return;const d=drag;drag=null;d.el.classList.remove("dragging");
  if(d.moved){suppressClick=true;setTimeout(()=>suppressClick=false,0);
    const patch=d.rz?{w:d.nw,h:d.nh}:{x:d.nx,y:d.ny};Object.assign(d.item,patch);render();
    await write(sb.from(d.kind).update({...patch,updated_at:new Date().toISOString()}).eq('id',d.item.id));}
  else if(pendingRender)render();
  pendingRender=false;
}
plan.addEventListener("pointerup",endDrag);plan.addEventListener("pointercancel",endDrag);
plan.addEventListener("click",e=>{
  if(suppressClick)return;const seat=e.target.closest(".seat"),area=e.target.closest(".area");
  if(seat){const p=derive().bySeat[seat.dataset.id];if(S.edit)openSheet("seat",seat.dataset.id);else if(p)openSheet("detail",p.id);else toast("空席です");}
  else if(area&&S.edit)openSheet("area",area.dataset.id);
});

/* ---------- sheet ---------- */
function openSheet(mode,id){S.sheet={mode,id};renderSheet();renderPlan();}
function closeSheet(){if(!S.sheet)return;S.sheet=null;$("#sheet").hidden=true;renderPlan();}
function renderSheet(){
  const sh=$("#sheet");if(!S.sheet){sh.hidden=true;return;}
  const{mode,id}=S.sheet;
  const kicker={detail:"社員情報",seat:"座席の設定",area:"エリアの設定"}[mode];
  const body={detail:sheetDetail,seat:sheetSeat,area:sheetArea}[mode](id);
  sh.replaceChildren(h("div",{class:"sh-bar"},h("span",{class:"sh-kicker",text:kicker}),h("button",{type:"button",class:"x","aria-label":"閉じる",onclick:closeSheet},"×")),...body);
  sh.hidden=false;
}
function row(label,val,o={}){
  const v=val?(o.tel?h("a",{class:"val mono",href:"tel:"+val.replace(/[^\d+]/g,""),text:val}):h("span",{class:"val"+(o.mono?" mono":""),text:val})):h("span",{class:"muted",text:"—"});
  return h("div",{class:"row"},h("dt",{text:label}),h("dd",{},v),val&&!o.nocopy?h("button",{type:"button",class:"copy",onclick:e=>copy(val,e.currentTarget)},"コピー"):h("span"));
}
function sheetDetail(pid){
  const p=S.people.find(x=>x.id===pid);if(!p)return[h("p",{class:"muted",text:"この社員は見つかりません。"})];
  const D=derive(),s=seatOf(p,D);
  const mobiles=(p.mobile||"").split(" / ").filter(Boolean);
  return[h("div",{},p.yomi?h("div",{class:"kana",text:p.yomi}):null,h("h2",{text:p.name}),
      h("div",{},p.honbu?h("span",{class:"chip"+(p.honbu==="エネルギー事業本部"?" light":""),style:hbStyle(p.honbu),text:p.honbu}):null,
        (p.dept||p.role)?h("span",{class:"dept",text:[p.dept,p.role].filter(Boolean).join("・")}):null)),
    h("dl",{class:"rows"},row("内線",p.phone_ext,{mono:true}),
      ...(mobiles.length?mobiles.map(m=>row("携帯",m,{tel:true})):[row("携帯","")]),
      p.phone_direct?row("直通",p.phone_direct,{tel:true}):null,row("メール",p.email),
      row("座席",s?`${s.floor}・席 ${D.seatNo[s.id]}`:"未配置",{nocopy:true}))];
}
function sheetSeat(id){
  const D=derive(),s=D.seatById[id];if(!s)return[h("p",{class:"muted",text:"この席は削除されました。"})];
  const cur=D.bySeat[id];
  const people=[...S.people].sort((a,b)=>(a.honbu||"").localeCompare(b.honbu||"","ja")||(a.yomi||a.name).localeCompare(b.yomi||b.name,"ja"));
  const sel=h("select",{id:"se-person",size:"8"});
  const filter=h("input",{id:"se-filter",type:"search",placeholder:"氏名・ふりがなで絞り込み",autocomplete:"off"});
  const fill=()=>{const t=norm(filter.value);sel.replaceChildren(h("option",{value:"",selected:!cur},"（空席にする）"));
    const groups={};for(const p of people){if(t&&!norm(p.name).includes(t)&&!norm(p.yomi).includes(t))continue;(groups[p.honbu||"本部なし"]||=[]).push(p);}
    for(const[g,ps]of Object.entries(groups))sel.append(h("optgroup",{label:g},ps.map(p=>{const ps2=seatOf(p,D);
      return h("option",{value:p.id,selected:cur&&cur.id===p.id},`${p.name}${p.dept?"（"+p.dept+"）":""} — ${ps2?(ps2.id===id?"この席":`${ps2.floor} 席${D.seatNo[ps2.id]}`):"未配置"}`);})));};
  filter.addEventListener("input",fill);fill();
  const del=h("button",{type:"button",class:"btn danger",onclick:async()=>{
    if(!del.hasAttribute("data-armed")){del.setAttribute("data-armed","");del.textContent="もう一度押すと削除";return;}
    closeSheet();await write(sb.from('seats').delete().eq('id',id),cur?`席を削除しました（${cur.name}さんは未配置になりました）`:"席を削除しました");}},"この席を削除");
  return[h("h2",{text:`${s.floor}・席 ${D.seatNo[id]}`}),
    h("div",{class:"field"},h("label",{for:"se-filter",class:"lbl"},"座る人"),filter),
    h("div",{class:"field"},h("label",{for:"se-person",class:"sr"},"社員を選択"),sel),
    h("p",{class:"hint",text:"ほかの席にいる人を選ぶと、その人がこの席へ移動します。いまこの席にいる人は未配置になります。"}),
    h("div",{class:"actions"},h("button",{type:"button",class:"btn primary",onclick:async()=>{
      const pid=sel.value;if((cur?cur.id:"")===pid){closeSheet();return;}
      closeSheet();await write(sb.rpc('seat_assign',{p_seat_id:id,p_employee_id:pid||null}),"席を更新しました");}},"保存"),del)];
}
function sheetArea(id){
  const a=S.areas.find(x=>x.id===id);if(!a)return[h("p",{class:"muted",text:"このエリアは削除されました。"})];
  const inp=h("input",{id:"ar-label",value:a.label||"",maxlength:"30"});
  const del=h("button",{type:"button",class:"btn danger",onclick:async()=>{
    if(!del.hasAttribute("data-armed")){del.setAttribute("data-armed","");del.textContent="もう一度押すと削除";return;}
    closeSheet();await write(sb.from('seat_areas').delete().eq('id',id),"エリアを削除しました");}},"このエリアを削除");
  return[h("div",{class:"field"},h("label",{for:"ar-label",class:"lbl"},"名前（会議室、受付、書庫など）"),inp),
    h("div",{class:"actions"},h("button",{type:"button",class:"btn primary",onclick:async()=>{
      closeSheet();await write(sb.from('seat_areas').update({label:inp.value.trim(),updated_at:new Date().toISOString()}).eq('id',id),"保存しました");}},"保存"),del)];
}

/* ---------- edit mode ---------- */
$("#editBtn").addEventListener("click",()=>{S.edit=!S.edit;const b=$("#editBtn");b.setAttribute("aria-pressed",String(S.edit));b.textContent=S.edit?"編集を終了":"編集モード";$("#toolbar").hidden=!S.edit;closeSheet();render();});
function freeSpot(w,hgt,list){
  for(let y=24;y+hgt<H-8;y+=64)for(let x=24;x+w<W-8;x+=112){if(!list.some(r=>x<r.x+r.w+4&&x+w+4>r.x&&y<r.y+r.h+4&&y+hgt+4>r.y))return{x:snap(x),y:snap(y)};}
  return{x:24,y:24};
}
$("#addSeat").addEventListener("click",async()=>{const p=freeSpot(SW,SH,[...S.seats.filter(s=>s.floor===S.floor).map(s=>({x:s.x,y:s.y,w:SW,h:SH})),...S.areas.filter(a=>a.floor===S.floor)]);
  await write(sb.from('seats').insert({floor:S.floor,x:p.x,y:p.y}),"席を追加しました。ドラッグで好きな位置へ動かせます");});
$("#addArea").addEventListener("click",async()=>{const p=freeSpot(240,160,S.areas.filter(a=>a.floor===S.floor));
  const{data,error}=await sb.from('seat_areas').insert({floor:S.floor,x:p.x,y:p.y,w:240,h:160,label:"新しいエリア"}).select('id').single();
  if(error){toast("追加できませんでした");return;}await loadAll();openSheet("area",data.id);});

/* ---------- search ---------- */
const q=$("#q"),res=$("#results");let composing=false;
q.addEventListener("compositionstart",()=>composing=true);
q.addEventListener("compositionend",()=>{composing=false;search();});
q.addEventListener("input",()=>{if(!composing)search();});
function search(){
  const t=norm(q.value);res.replaceChildren();if(!t){res.hidden=true;return;}
  const D=derive();
  const hits=S.people.filter(p=>[p.name,p.yomi,p.dept,p.phone_ext].some(v=>v&&norm(v).includes(t))).slice(0,12);
  if(!hits.length)res.append(h("li",{class:"muted",style:"padding:6px 8px",text:"見つかりません"}));
  for(const p of hits){const s=seatOf(p,D);
    res.append(h("li",{},h("button",{type:"button",onclick:()=>jump(p.id)},h("span",{text:p.name}),h("span",{class:"mono",text:p.phone_ext?"内線 "+p.phone_ext:""}),
      h("span",{class:"sub",text:`${p.honbu||""}${p.dept?" / "+p.dept:""}・${s?s.floor:"座席未登録"}`}))));}
  res.hidden=false;
}
function jump(pid){
  const p=S.people.find(x=>x.id===pid);if(!p)return;const s=seatOf(p,derive());
  res.hidden=true;q.value="";
  if(s){S.floor=s.floor;S.hl=s.id;setTimeout(()=>{S.hl=null;},2600);}
  render();openSheet("detail",pid);
  if(s){const el=plan.querySelector(`[data-id="${s.id}"]`);if(el)el.scrollIntoView({block:"center",inline:"center"});}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!res.hidden)res.hidden=true;else closeSheet();}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true;});

/* ---------- utils ---------- */
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}
function copy(text,btn){
  const done=()=>{btn.textContent="コピー済";setTimeout(()=>btn.textContent="コピー",1500);};
  try{navigator.clipboard.writeText(text).then(done,()=>selectNear(btn));}catch(e){selectNear(btn);}
}
function selectNear(btn){const v=btn.parentElement.querySelector(".val");if(!v)return;const r=document.createRange();r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("選択しました。Ctrl+C でコピーできます");}

/* ---------- boot ---------- */
async function start(session){
  const{data:role,error}=await sb.rpc('seat_caller_role');
  if(error||!role){$("#loginView").hidden=false;$("#appView").hidden=true;
    showLoginErr(error?"座席表の準備ができていません（管理本部にご連絡ください）":"このアカウントは社員情報に登録されていません。");return;}
  const{data:canView}=await sb.rpc('seat_can_view');
  if(!canView){showNotice(role==='vehicle_phone'?"座席表は現在準備中です。公開までお待ちください。":"座席表を見る権限がありません。");return;}
  S.canEdit=role==='full';
  $("#userChip").textContent=session.user.email;
  $("#loginView").hidden=true;$("#appView").hidden=false;$("#editBtn").hidden=!S.canEdit;
  fit();render();await loadAll();
}
function showNotice(m){$("#loginView").hidden=true;$("#appView").hidden=true;const n=$("#noticeView");n.querySelector("p").textContent=m;n.hidden=false;}
function showLoginErr(m){const e=$("#loginErr");e.textContent=m;e.hidden=false;}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("#loginErr").hidden=true;
  const email=$("#li-email").value.trim(),pw=$("#li-pw").value;
  if(!email||!pw){showLoginErr("メールアドレスとパスワードを入力してください");return;}
  const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){showLoginErr("ログインに失敗しました：メールアドレスまたはパスワードが違います");return;}
  start(data.session);
});
window.addEventListener("focus",()=>{if(S.loaded&&!drag)loadAll();});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session){$("#loginView").hidden=false;return;}start(session);})();
</script>
