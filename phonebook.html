<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>電話番号帳 | 南和グループ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f5f5;color:#333}
header{background:#1a2d5a;color:#fff;padding:16px 24px}
header h1{font-size:20px;font-weight:700}
header p{font-size:12px;opacity:.7;margin-top:2px}
.toolbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:12px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:200px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.toolbar select{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;background:#fff}
.count{padding:8px 24px;font-size:12px;color:#888}
.tbl-wrap{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
thead{background:#f8f8f8}
th{padding:10px 12px;text-align:left;font-size:12px;color:#666;border-bottom:2px solid #eee;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{background:#f0f0f0}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-kanri{background:#1a2d5a;color:#fff}
.b-energy{background:#f5c400;color:#5a3d00}
.b-kankyo{background:#1a6fc4;color:#fff}
.b-eisei{background:#d94040;color:#fff}
.b-kensetsu{background:#2e7d32;color:#fff}
.b-zairyo{background:#0097a7;color:#fff}
.b-gray{background:#F1EFE8;color:#5F5E5A}
.b-iphone{background:#E6F1FB;color:#0C447C}
.b-android{background:#EAF3DE;color:#27500A}
.b-ipad{background:#EEEDFE;color:#3C3489}
.b-sha{background:#e8f4e8;color:#2e7d32;border:1px solid #a5d6a7}
.b-kojin{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.phone-num{font-family:monospace;font-size:13px;font-weight:600;letter-spacing:.5px}
.empty{padding:40px;text-align:center;color:#aaa;font-size:14px}
.export-btn{padding:8px 16px;background:#1a2d5a;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.export-btn:hover{background:#2a3d6a}
.tabs{display:flex;gap:4px;padding:12px 24px 0;background:#fff}
.tab{padding:10px 18px;border:none;background:none;font-size:14px;color:#666;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
.tab.active{color:#1a2d5a;font-weight:700;border-bottom-color:#1a2d5a}
.tab .n{font-size:11px;color:#999;margin-left:4px}
.mono{font-family:monospace;font-size:12px;color:#555}
a.phone-num{color:#1a2d5a;text-decoration:none}
a.phone-num:hover{text-decoration:underline}
@media(max-width:600px){header,.toolbar,.tabs{padding-left:16px;padding-right:16px}.tbl-wrap{padding:0 16px 16px}.count{padding:8px 16px}th,td{padding:8px}}
</style>
</head>
<body>
<header>
  <h1>電話番号帳</h1>
  <p id="subtitle">社給携帯・Wi-Fiルーター 一覧（個人携帯は掲載していません）</p>
</header>
<div class="tabs">
  <button class="tab active" data-kind="携帯" onclick="setTab('携帯')">社給携帯<span class="n" id="n-携帯"></span></button>
  <button class="tab" data-kind="Wi-Fi" onclick="setTab('Wi-Fi')">Wi-Fiルーター<span class="n" id="n-Wi-Fi"></span></button>
</div>
<div class="toolbar">
  <input type="text" id="search" placeholder="氏名・電話番号・機種名・管理No・事業本部で検索..." oninput="render()">
  <select id="f-honbu" onchange="render()"><option value="">全事業本部</option></select>
  <button class="export-btn" onclick="exportCSV()">CSVエクスポート</button>
</div>
<div class="count" id="count"></div>
<div class="tbl-wrap" id="tbl-wrap"><div class="empty">読み込み中...</div></div>

<script>
const SUPABASE_URL = 'https://cicxvcjnvkynhukbnrns.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpY3h2Y2pudmt5bmh1a2Jucm5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNjI4ODYsImV4cCI6MjA5MTYzODg4Nn0.MQs-YYzLJ-gEgvgY7vyw2NGwzqc76TLWIq08GDK8sMQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const HB_CLS = {
  '管理本部':'b-kanri',
  'エネルギー事業本部':'b-energy',
  '環境衛生事業本部':'b-kankyo',
  '衛生管理部':'b-eisei',
  '建設事業本部':'b-kensetsu',
  '建設資材事業本部':'b-zairyo'
};

// タブごとの表示列（順番どおりに表示）
const COLS = {
  '携帯':  ['honbu','assignee','phone','category','model','contract_no'],
  'Wi-Fi': ['honbu','assignee','model','contract_no']
};
const CAT_CLS = {'iPhone':'b-iphone','Android':'b-android','iPad':'b-ipad'};

let DATA = [];
let TAB = '携帯';
let sortCol = 'honbu', sortDir = 1;

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const digits = v => String(v||'').replace(/[^0-9]/g,'');

async function load(){
  // 公開用関数：社給携帯＋Wi-Fiの 種別・事業本部・氏名・読み・管理No・番号 のみ返す
  let {data, error} = await sb.rpc('public_directory');
  if(error){
    // 旧関数（社給携帯のみ）で代替表示
    const r = await sb.rpc('public_phonebook');
    if(r.error){
      document.getElementById('tbl-wrap').innerHTML = '<div class="empty">データの読み込みに失敗しました</div>';
      return;
    }
    data = (r.data||[]).map(d=>({...d, kind:'携帯', contract_no:null}));
  }
  DATA = data || [];
  ['携帯','Wi-Fi'].forEach(k=>{
    document.getElementById('n-'+k).textContent = DATA.filter(d=>d.kind===k).length;
  });
  const honbus = [...new Set(DATA.map(d=>d.honbu).filter(Boolean))];
  const sel = document.getElementById('f-honbu');
  honbus.forEach(h=>{
    const o = document.createElement('option');
    o.value = h; o.textContent = h;
    sel.appendChild(o);
  });
  const h = decodeURIComponent(location.hash.slice(1));
  if(h === 'wifi' || h === 'Wi-Fi') TAB = 'Wi-Fi';
  setTab(TAB);
}

function setTab(k){
  TAB = k;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.kind===k));
  try{ history.replaceState(null,'', k==='Wi-Fi' ? '#wifi' : location.pathname + location.search); }catch(e){}
  render();
}

function sortBy(col){
  if(sortCol === col) sortDir = -sortDir;
  else { sortCol = col; sortDir = 1; }
  render();
}
function sortIcon(col){
  if(sortCol !== col) return '<span style="color:#ccc;margin-left:4px">↕</span>';
  return sortDir === 1
    ? '<span style="margin-left:4px">▲</span>'
    : '<span style="margin-left:4px">▼</span>';
}

function filteredData(){
  const q = document.getElementById('search').value.trim();
  const qd = digits(q);
  const hb = document.getElementById('f-honbu').value;
  return DATA.filter(d=>{
    if(d.kind !== TAB) return false;
    const mq = !q ||
      (d.assignee||'').replace(/[\s　]/g,'').includes(q.replace(/[\s　]/g,'')) ||
      (d.yomi||'').includes(q) ||
      (d.honbu||'').includes(q) ||
      (d.contract_no||'').toLowerCase().includes(q.toLowerCase()) ||
      (d.model||'').toLowerCase().includes(q.toLowerCase()) ||
      (d.category||'').toLowerCase().includes(q.toLowerCase()) ||
      (qd.length >= 3 && digits(d.phone).includes(qd));
    const mh = !hb || d.honbu === hb;
    return mq && mh;
  });
}

function render(){
  const filtered = filteredData();
  filtered.sort((a,b)=>{
    const key = d => sortCol === 'assignee' ? (d.yomi||d.assignee||'') : (d[sortCol]||'');
    const av = key(a), bv = key(b);
    if(!av !== !bv) return av ? -1 : 1;           // 空欄は常に末尾
    if(av !== bv) return av < bv ? -sortDir : sortDir;
    const an = a.yomi||a.assignee||'', bn = b.yomi||b.assignee||'';  // 同じ値は氏名順
    if(!an !== !bn) return an ? -1 : 1;
    return an < bn ? -1 : an > bn ? 1 : 0;
  });
  document.getElementById('count').textContent = `${filtered.length}件表示`;
  if(!filtered.length){
    document.getElementById('tbl-wrap').innerHTML =
      '<div class="empty">該当するデータが見つかりません</div>';
    return;
  }
  const NA = '<span style="color:#ccc">—</span>';
  const C = {
    honbu:   {label:'事業本部', w:170, html:d=>`<span class="badge ${HB_CLS[d.honbu]||'b-gray'}">${esc(d.honbu)||'—'}</span>`},
    assignee:{label:'氏名',     w:140, html:d=>d.assignee?`<b>${esc(d.assignee)}</b>`:'<span style="color:#ccc">未割当</span>'},
    phone:   {label:'電話番号', w:150, html:d=>d.phone?`<a class="phone-num" href="tel:${digits(d.phone)}">${esc(d.phone)}</a>`:NA},
    category:{label:'カテゴリ', w:100, html:d=>d.category?`<span class="badge ${CAT_CLS[d.category]||'b-gray'}">${esc(d.category)}</span>`:NA},
    model:   {label:'機種名',   w:0,   html:d=>esc(d.model)||NA},
    contract_no:{label:'管理No', w:110, html:d=>`<span class="mono">${esc(d.contract_no)||'—'}</span>`}
  };
  const cols = COLS[TAB];
  document.getElementById('tbl-wrap').innerHTML = `
    <table>
      <thead><tr>
        ${cols.map(k=>`<th${C[k].w?` style="width:${C[k].w}px"`:''} onclick="sortBy('${k}')">${C[k].label}${sortIcon(k)}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${filtered.map(d=>`<tr>${cols.map(k=>`<td>${C[k].html(d)}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
  `;
}

function exportCSV(){
  const L = {honbu:'事業本部',assignee:'氏名',phone:'電話番号',category:'カテゴリ',model:'機種名',contract_no:'管理No'};
  const cols = COLS[TAB];
  const rows = [cols.map(k=>L[k])];
  filteredData().forEach(d=>rows.push(cols.map(k=>d[k])));
  const csv = rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const bom = '﻿';
  const blob = new Blob([bom+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = TAB==='Wi-Fi' ? 'Wi-Fiルーター一覧.csv' : '社給携帯一覧.csv';
  a.click();
}

load();
</script>
</body>
</html>
